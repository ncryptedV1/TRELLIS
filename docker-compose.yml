services:
  trellis-gradio-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: trellis-gradio-demo
    ports:
      - "8080:8080"
    environment:
      - ATTN_BACKEND=flash-attn
      - SPCONV_ALGO=native
      - PYTHONUNBUFFERED=1
    volumes:
      - ./.local:/nonexistent/.local # Bind mount for cached pip installs
      - ./.cache:/nonexistent/.cache # Bind mount for cached e.g. torch models cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
    runtime: nvidia
